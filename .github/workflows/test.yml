name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  deterministic:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:all
      - run: npm pack --dry-run --ignore-scripts
